[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-map"
version = "0.10.1"
description = "Interactive floor plan visualization for NetBox sites"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Christian Rose" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff"]
test = ["coverage"]

[project.urls]
Homepage = "https://github.com/DenDanskeMine/netbox-map"
Repository = "https://github.com/DenDanskeMine/netbox-map"
Issues = "https://github.com/DenDanskeMine/netbox-map/issues"
Documentation = "https://dendanskemine.github.io/netbox-map/"
Changelog = "https://github.com/DenDanskeMine/netbox-map/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["netbox_map*"]

[tool.setuptools.package-data]
netbox_map = [
    "templates/**/*",
    "static/**/*",
    "migrations/*",
]

[tool.coverage.run]
source = ["netbox_map"]
omit = ["netbox_map/migrations/*"]

[tool.coverage.report]
show_missing = true
