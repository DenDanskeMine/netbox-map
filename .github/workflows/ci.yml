name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check netbox_map/

  test:
    name: Test (NetBox ${{ matrix.netbox_ref }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Don't cancel sibling jobs — surface every version failure independently
      fail-fast: false
      matrix:
        # Test against the latest patch of every NetBox minor line listed in
        # the compatibility matrix (README.md / docs/index.md). Add/remove
        # entries here when the support window changes.
        netbox_ref:
          - v4.5.10  # 4.5.x line — minimum supported
          - v4.6.1   # 4.6.x line — current
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - name: Checkout NetBox ${{ matrix.netbox_ref }}
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox_ref }}
          path: netbox

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: netbox-map

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NetBox dependencies
        run: pip install -r netbox/requirements.txt

      - name: Install plugin
        run: pip install -e ./netbox-map[test]

      - name: Configure NetBox for testing
        run: |
          cat > netbox/netbox/netbox/configuration_testing.py << 'CONF'
          ALLOWED_HOSTS = ['*']
          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': 'localhost',
              'PORT': '',
              'CONN_MAX_AGE': 300,
              'ENGINE': 'django.db.backends.postgresql',
          }
          PLUGINS = ['netbox_map']
          REDIS = {
              'tasks': {
                  'HOST': 'localhost',
                  'PORT': 6379,
                  'DATABASE': 0,
                  'SSL': False,
              },
              'caching': {
                  'HOST': 'localhost',
                  'PORT': 6379,
                  'DATABASE': 1,
                  'SSL': False,
              },
          }
          SECRET_KEY = 'test-secret-key-not-for-production-use-1234567890abcdef'
          DEFAULT_PERMISSIONS = {}
          API_TOKEN_PEPPERS = {1: 'abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ'}
          CONF

      - name: Run migrations
        working-directory: netbox/netbox
        env:
          NETBOX_CONFIGURATION: netbox.configuration_testing
        run: python manage.py migrate --no-input

      - name: Run tests
        working-directory: netbox/netbox
        env:
          NETBOX_CONFIGURATION: netbox.configuration_testing
        run: python -m coverage run --source=netbox_map manage.py test netbox_map.tests --keepdb -v2

      - name: Coverage report
        working-directory: netbox/netbox
        run: python -m coverage report
